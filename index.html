<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Hash Seguro</title>
    
    <!-- Google Fonts - Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-header p {
            font-size: 0.95rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .card-body {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Roboto', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #757575;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #667eea;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 25px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .result-box.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hash-output {
            background: white;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            word-break: break-all;
            color: #333;
            border: 1px solid #e0e0e0;
            margin-bottom: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
        }

        .btn-copy {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-copy:hover {
            background: #43a047;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .btn-copy.copied {
            background: #667eea;
        }

        .info-text {
            text-align: center;
            font-size: 0.8rem;
            color: #999;
            margin-top: 20px;
            font-style: italic;
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .card-header h2 {
                font-size: 1.5rem;
            }
            
            .card-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>
                    <span class="material-icons">lock</span>
                    Gerador de Hash Seguro
                </h2>
                <p>Converta senhas em hashes criptografados</p>
            </div>
            
            <div class="card-body">
                <div class="input-group">
                    <label>
                        <span class="material-icons" style="font-size: 18px;">vpn_key</span>
                        Senha desejada:
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="senhaInput" 
                            placeholder="Digite sua senha aqui..."
                            autocomplete="off"
                        >
                        <button class="toggle-password" onclick="togglePassword()" title="Mostrar/Ocultar senha">
                            <span class="material-icons" id="toggleIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <button class="btn-generate" onclick="gerarHash()">
                    <span class="material-icons">security</span>
                    Gerar Hash
                </button>

                <div class="result-box" id="resultBox">
                    <div class="result-label">
                        <span class="material-icons" style="font-size: 18px;">code</span>
                        HASH GERADO:
                    </div>
                    <div class="hash-output" id="hashOutput"></div>
                    <button class="btn-copy" id="copyBtn" onclick="copiarHash()">
                        <span class="material-icons">content_copy</span>
                        Copiar Hash
                    </button>
                </div>

                <p class="info-text">
                    O hash é gerado localmente no seu navegador. Nenhuma informação é enviada para servidores.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Função para mostrar/ocultar senha
        function togglePassword() {
            const input = document.getElementById('senhaInput');
            const icon = document.getElementById('toggleIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Função para gerar hash usando Web Crypto API
        async function gerarHash() {
            const senha = document.getElementById('senhaInput').value;
            
            if (!senha) {
                alert('Por favor, digite uma senha!');
                return;
            }

            try {
                // Converter senha para ArrayBuffer
                const encoder = new TextEncoder();
                const data = encoder.encode(senha);

                // Gerar hash SHA-256
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                
                // Converter para hexadecimal
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                // Adicionar um salt aleatório para maior segurança (simulando bcrypt)
                const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)))
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
                
                // Criar hash final combinado (simulando formato bcrypt-like)
                const hashFinal = `$2b$12$${salt}${hashHex}`;

                // Exibir resultado
                document.getElementById('hashOutput').textContent = hashFinal;
                document.getElementById('resultBox').classList.add('show');
                
                // Scroll suave para o resultado
                document.getElementById('resultBox').scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'nearest' 
                });

            } catch (error) {
                console.error('Erro ao gerar hash:', error);
                alert('Erro ao gerar hash. Tente novamente.');
            }
        }

        // Função para copiar hash
        function copiarHash() {
            const hashText = document.getElementById('hashOutput').textContent;
            const btn = document.getElementById('copyBtn');
            
            navigator.clipboard.writeText(hashText).then(() => {
                btn.classList.add('copied');
                btn.innerHTML = '<span class="material-icons">check</span> Copiado!';
                
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = '<span class="material-icons">content_copy</span> Copiar Hash';
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar:', err);
                alert('Erro ao copiar. Tente selecionar e copiar manualmente.');
            });
        }

        // Permitir gerar hash pressionando Enter
        document.getElementById('senhaInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                gerarHash();
            }
        });
    </script>
</body>
</html>
